<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Indore Institute · Online Test</title>
	<script src="https://accounts.google.com/gsi/client" async defer></script>
	<style>
		:root {
			--bg: #f3f5f8;
			--card: #fff;
			--ink: #d1d1d1;
			--mut: #667085;
			--acc: #1b4d8f;
			--line: #d9dee7;
			--ok: #1d7a4d;
			--err: #b42318
		}

		@media(prefers-color-scheme:dark) {
			:root {
				--bg: #e9e9e9;
				--card: #17203a;
				--ink: #e8ecf5;
				--mut: #9aa6bf;
				--acc: #7fb2f0;
				--line: #2b3757;
				--ok: #5fcf9a;
				--err: #ff8a80
			}
		}

		* {
			box-sizing: border-box
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 20px;
			background: var(--bg);
			color: var(--ink);
			font: 16px/1.55 Georgia, "Times New Roman", serif
		}

		h1, h2, button, input, th, .ui {
			font-family: system-ui, -apple-system, "Segoe UI", sans-serif
		}

		main {
			width: 400px;
			max-width: 640px;
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: 10px;
			padding: 28px;
			position: relative
		}

		#admin {
			max-width: 760px
		}

		h1 {
			font-size: 1.5rem;
			margin: 0 0 6px
		}

		h2 {
			font-size: 1.1rem;
			margin: 0 0 4px
		}

		p.mut,
		.mut {
			color: var(--mut)
		}

		button {
			font: inherit;
			font-size: .95rem;
			cursor: pointer;
			border-radius: 6px;
			border: 1px solid var(--line);
			background: var(--card);
			color: var(--ink);
			padding: 9px 16px
		}

		button.pri {
			background: var(--acc);
			border-color: var(--acc);
			color: #fff
		}

		@media(prefers-color-scheme:dark) {
			button.pri {
				color: #0f1624
			}
		}

		button:disabled {
			opacity: .45;
			cursor: not-allowed
		}

		button:focus-visible,
		input:focus-visible {
			outline: 3px solid var(--acc);
			outline-offset: 2px
		}

		.home {
			position: absolute;
			top: 14px;
			right: 14px;
			padding: 7px;
			line-height: 0
		}

		.home svg {
			width: 22px;
			height: 22px;
			stroke: currentColor;
			fill: none;
			stroke-width: 1.8;
			stroke-linejoin: round
		}

		.err {
			color: var(--err);
			min-height: 1.4em;
			font-family: system-ui, sans-serif;
			font-size: .9rem
		}

		.opt {
			display: flex;
			gap: 12px;
			align-items: flex-start;
			width: 100%;
			text-align: left;
			margin: 8px 0;
			padding: 12px 14px;
			font-family: Georgia, serif;
			font-size: 1rem
		}

		.opt b.n {
			font-family: system-ui, sans-serif;
			min-width: 1.4em;
			color: var(--mut)
		}

		.opt.on {
			border-color: var(--acc);
			box-shadow: inset 0 0 0 1px var(--acc);
			background: color-mix(in srgb, var(--acc) 10%, transparent)
		}

		.q {
			font-size: 1.2rem;
			margin: 10px 0 16px
		}

		.bar {
			height: 5px;
			background: var(--line);
			border-radius: 3px;
			overflow: hidden
		}

		.bar i {
			display: block;
			height: 100%;
			background: var(--acc);
			transition: width .25s
		}

		.nav {
			display: flex;
			justify-content: space-between;
			margin-top: 20px
		}

		input[type=password] {
			width: 100%;
			padding: 10px 12px;
			font-size: 1rem;
			border: 1px solid var(--line);
			border-radius: 6px;
			background: var(--bg);
			color: var(--ink);
			margin: 12px 0 6px
		}

		table {
			width: 100%;
			border-collapse: collapse;
			margin-top: 14px;
			font-family: system-ui, sans-serif
		}

		th,
		td {
			text-align: left;
			padding: 9px 10px;
			border-bottom: 1px solid var(--line)
		}

		th {
			font-size: .85rem;
			color: var(--mut)
		}

		[hidden] {
			display: none !important
		}
	</style>
</head>

<body>

	<!-- 1. SIGN IN -->
	<main id="login">
		<button class="home" id="homeBtn" title="Admin login" aria-label="Admin login">
			<svg viewBox="0 0 24 24">
				<path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10M10 20v-6h4v6" />
			</svg>
		</button>
		<h1>CS1 PDP - Online Test</h1>
		<p class="mut ui">Sign in with your institute Google account to begin.</p>
		<div id="gbtn" style="margin:22px 0 8px"></div>
		<div class="err" id="loginErr"></div>
	</main>

	<!-- 2. TEST -->
	<main id="test" hidden>
		<div class="ui mut" id="who" style="font-size:.85rem"></div>
		<div class="bar" style="margin:10px 0 4px"><i id="prog"></i></div>
		<div class="ui mut" id="count" style="font-size:.85rem"></div>
		<div class="q" id="qtext"></div>
		<div id="opts"></div>
		<div class="err" id="testErr"></div>
		<div class="nav">
			<button id="prev" aria-label="Previous question">&larr; Prev</button>
			<button id="next" class="pri" aria-label="Next question">Next &rarr;</button>
		</div>
	</main>

	<!-- 3. DONE -->
	<main id="done" hidden>
		<h1>Test submitted</h1>
		<p class="mut ui" id="doneMsg"></p>
		<button id="backReview">Review answers</button>
	</main>

	<!-- 4. ADMIN -->
	<main id="admin" hidden>
		<button id="adminBack" class="ui">&larr; Back</button>
		<div id="adminLogin">
			<h2 style="margin-top:18px">Admin login</h2>
			<input type="password" id="pw" placeholder="Password" autocomplete="off">
			<div class="err" id="adminErr"></div>
			<button class="pri" id="pwGo">Login</button>
		</div>
		<div id="dash" hidden>
			<h2 style="margin-top:18px">Live results <span class="mut" id="stamp"
					style="font-weight:400;font-size:.85rem"></span></h2>
			<table>
				<thead>
					<tr>
						<th>Name</th>
						<th>Score</th>
						<th>Total attempt</th>
					</tr>
				</thead>
				<tbody id="rows"></tbody>
			</table>
		</div>
	</main>

	<script>
		/* ======== CONFIG ======== */
		const API = "http://127.0.0.1:8000";                       // your FastAPI URL
		const GOOGLE_CLIENT_ID = "215614999054-8seuea0iui18ic4cvnnlp6ko707f1tck.apps.googleusercontent.com";

		/* correct = option number (1-4). Keep in sync with ANSWERS in main.py.
		   Use <b>, <i>, <u> inside questions/options as needed. */
		const QUESTIONS = [
			{ q: "Which tag renders <i>italic</i> text in HTML?", options: ["&lt;i&gt;", "&lt;b&gt;", "&lt;u&gt;", "&lt;p&gt;"], correct: 1 },
			{ q: "Which of these is a <u>relational</u> database?", options: ["MongoDB", "PostgreSQL", "Redis", "Neo4j"], correct: 2 },
			{ q: "What is the value of <b><i>2</i></b> &times; <u>3</u>?", options: ["5", "6", "8", "9"], correct: 2 },
		];

		/* ======== STATE ======== */
		const $ = id => document.getElementById(id);
		let token = null, cur = 0, sel = {}, timer = null;
		const screens = ["login", "test", "done", "admin"];
		const show = id => screens.forEach(s => $(s).hidden = s !== id);

		/* ======== GOOGLE SIGN-IN ======== */
		window.addEventListener("load", () => {
			const t = setInterval(() => {
				if (!window.google) return; clearInterval(t);
				google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogle });
				google.accounts.id.renderButton($("gbtn"), { theme: "outline", size: "large", text: "signin_with" });
			}, 100);
		});

		async function onGoogle(resp) {
			$("loginErr").textContent = "";
			try {
				const r = await fetch(API + "/auth", { method: "POST", headers: { Authorization: "Bearer " + resp.credential } });
				const d = await r.json();
				if (!r.ok) throw new Error(d.detail || "Sign-in failed.");
				token = resp.credential;
				sel = {}; Object.entries(d.answers).forEach(([k, v]) => sel[k] = v);   // resume earlier answers
				$("who").textContent = d.name + " · " + d.email;
				cur = 0; render(); show("test");
			} catch (e) { $("loginErr").textContent = e.message; }
		}

		/* ======== TEST ======== */
		function render() {
			const q = QUESTIONS[cur], n = QUESTIONS.length;
			$("count").textContent = `Question ${cur + 1} of ${n}`;
			$("prog").style.width = ((cur + 1) / n * 100) + "%";
			$("qtext").innerHTML = q.q;
			$("opts").innerHTML = "";
			q.options.forEach((o, i) => {
				const b = document.createElement("button");
				b.className = "opt" + (sel[cur] === i + 1 ? " on" : "");
				b.innerHTML = `<b class="n">${"ABCD"[i]}</b><span>${o}</span>`;
				b.onclick = () => { sel[cur] = i + 1; render(); };
				$("opts").appendChild(b);
			});
			$("prev").disabled = cur === 0;
			$("next").innerHTML = cur === n - 1 ? "Finish" : "Next &rarr;";
			$("testErr").textContent = "";
		}

		$("prev").onclick = () => { cur--; render(); };   // Prev: navigation only, no DB write

		$("next").onclick = async () => {                 // Next: save answer to DB, then move on
			$("next").disabled = true;
			try {
				if (sel[cur]) {
					const r = await fetch(API + "/answer", {
						method: "POST",
						headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
						body: JSON.stringify({ q: cur, choice: sel[cur] })
					});
					if (!r.ok) throw new Error((await r.json()).detail || "Could not save your answer.");
				}
				if (cur === QUESTIONS.length - 1) {
					const a = Object.keys(sel).length;
					$("doneMsg").textContent = `You answered ${a} of ${QUESTIONS.length} questions. You can close this page.`;
					show("done");
				} else { cur++; render(); }
			} catch (e) { $("testErr").textContent = e.message; }
			$("next").disabled = false;
		};
		$("backReview").onclick = () => { cur = 0; render(); show("test"); };

		/* ======== ADMIN ======== */
		$("homeBtn").onclick = () => { show("admin"); $("adminLogin").hidden = false; $("dash").hidden = true; $("pw").value = ""; $("pw").focus(); };
		$("adminBack").onclick = () => { clearInterval(timer); show("login"); };
		$("pw").addEventListener("keydown", e => e.key === "Enter" && $("pwGo").click());

		async function loadRows() {
			const r = await fetch(API + "/admin/results", { headers: { "X-Admin-Password": $("pw").value } });
			if (!r.ok) throw new Error("Wrong password.");
			const data = await r.json();
			const tb = $("rows"); tb.innerHTML = "";               // only the table body is redrawn
			data.forEach(x => {
				const tr = document.createElement("tr");
				[x.name, x.score, x.total_attempted].forEach(v => { const td = document.createElement("td"); td.textContent = v ?? ""; tr.appendChild(td); });
				tb.appendChild(tr);
			});
			$("stamp").textContent = "· updated " + new Date().toLocaleTimeString();
		}

		$("pwGo").onclick = async () => {
			$("adminErr").textContent = "";
			try {
				await loadRows();
				$("adminLogin").hidden = true; $("dash").hidden = false;
				clearInterval(timer);
				timer = setInterval(() => loadRows().catch(() => { }), 3000);   // refresh every 3s
			} catch (e) { $("adminErr").textContent = e.message; }
		};
	</script>
</body>

</html>
